<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭营养膳食规划系统</title>
<style>
  :root {
    --bg: #f3f7f2;
    --panel: #ffffff;
    --ink: #23332a;
    --muted: #6b7d70;
    --line: #e2eadf;
    --brand: #2e8b57;
    --brand-dark: #1f6e43;
    --brand-soft: #e6f2ea;
    --accent: #d98e2b;
    --bad: #c0392b;
    --good: #2e8b57;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { display: flex; min-height: 100vh; }
  /* ---------- sidebar ---------- */
  .side {
    width: 300px; flex: 0 0 300px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 18px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .side h1 .leaf { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); display: inline-flex; align-items: center; justify-content: center; }
  .side .sub { font-size: 12px; color: var(--muted); margin: 6px 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #3c4f43; }
  .field select, .field input[type="number"], .field input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; background: #fbfdfb; color: var(--ink); outline: none;
  }
  .field select:focus, .field input:focus { border-color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; user-select: none; background: #fbfdfb;
    transition: all .15s;
  }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .budget-row { display: flex; align-items: center; gap: 10px; }
  .budget-row input[type="range"] { flex: 1; accent-color: var(--brand); }
  .budget-val { min-width: 56px; font-weight: 700; color: var(--brand-dark); font-size: 14px; text-align: right; }
  .tabs { display: flex; gap: 6px; margin: 16px 0 12px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--line); cursor: pointer; background: #fbfdfb; font-weight: 600;
  }
  .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .go {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(46,139,87,.28);
  }
  .go:hover { filter: brightness(1.06); }
  .side .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  /* ---------- main ---------- */
  .main { flex: 1; padding: 26px 30px; max-width: 1180px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .topbar h2 { font-size: 22px; }
  .topbar .meta { font-size: 13px; color: var(--muted); }
  .banner { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }
  .banner.bad { background: #fdecea; color: var(--bad); border: 1px solid #f5c6c0; }
  .banner.good { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #c3e2d1; }
  .banner.warn { background: #fdf3e3; color: #9a6212; border: 1px solid #f0d5a5; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }
  .meal-card { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); padding: 16px; }
  .meal-card h3 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .meal-card h3 .cost { font-size: 13px; color: var(--brand-dark); font-weight: 700; }
  .meal-card ul { list-style: none; }
  .meal-card li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .meal-card li:last-child { border-bottom: none; }
  .meal-card li .g { color: var(--muted); font-size: 12px; }
  .role-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-dark); margin-right: 8px; white-space: nowrap; }
  /* summary panel */
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .summary h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 150px; background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .stat .v.over { color: var(--bad); }
  .bar { height: 8px; border-radius: 6px; background: #e9efe9; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: var(--brand); }
  .macro { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
  .macro i { display: block; height: 100%; }
  .macro-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .macro-legend b { color: var(--ink); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .adequacy { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .adq { background: #fbfdfb; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .adq .top { display: flex; justify-content: space-between; font-size: 12px; }
  .adq .top b { font-size: 13px; }
  .adq .pct { font-size: 12px; font-weight: 700; }
  .adq .bar { height: 6px; margin-top: 5px; }
  .pct.good { color: var(--good); } .pct.warn { color: var(--accent); } .pct.bad { color: var(--bad); }
  /* week view */
  .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .day-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .day-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .day-card .head h3 { font-size: 15px; }
  .day-card .head .cost { font-size: 12px; color: var(--brand-dark); font-weight: 700; }
  .day-card .kcal { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .day-card ul { list-style: none; }
  .day-card li { font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; }
  .day-card li:last-child { border-bottom: none; }
  .day-card .meal-sep { font-size: 11px; color: var(--brand-dark); font-weight: 700; margin: 8px 0 2px; }
  .diversity { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .div-item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; text-align: center; }
  .div-item .d { font-size: 20px; font-weight: 800; color: var(--brand-dark); }
  .div-item .k { font-size: 12px; color: var(--muted); }
  /* ---------- 采购库存 ---------- */
  .shop-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 0; }
  .shop-grid .summary { margin-bottom: 0; }
  .btn {
    border: 1px solid var(--brand); background: var(--brand); color: #fff;
    border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.ghost { background: #fff; color: var(--brand-dark); }
  .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inline-form input, .inline-form select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; background: #fbfdfb; }
  .members { display: flex; gap: 10px; flex-wrap: wrap; }
  .member-card { background: #fbfdfb; border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; min-width: 140px; position: relative; }
  .member-card .nm { font-weight: 700; font-size: 14px; padding-right: 18px; }
  .member-card .dd { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .member-card .rm { position: absolute; top: 6px; right: 8px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .member-card .rm:hover { color: var(--bad); }
  table.shop { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.shop th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.shop td { padding: 8px; border-bottom: 1px dashed var(--line); vertical-align: middle; }
  table.shop tr:last-child td { border-bottom: none; }
  table.shop select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; background: #fbfdfb; }
  .st { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .st-pending { background: #fdf3e3; color: #9a6212; }
  .st-arrived { background: var(--brand-soft); color: var(--brand-dark); }
  .allergen-flag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 5px; background: #fdecea; color: var(--bad); margin-left: 6px; }
  .group-title { font-size: 13px; font-weight: 700; color: var(--brand-dark); margin: 14px 0 6px; }
  .group-title:first-child { margin-top: 0; }
  .day-strip { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .day-chip {
    border: 1px solid var(--line); background: #fbfdfb; border-radius: 10px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; text-align: center; user-select: none;
  }
  .day-chip.done { background: var(--brand-soft); border-color: #b8dcc6; color: var(--brand-dark); font-weight: 700; }
  .day-chip.next { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,142,43,.15); }
  .day-chip.locked { opacity: .55; cursor: not-allowed; }
  .events { list-style: none; font-size: 12.5px; color: #43544a; max-height: 260px; overflow-y: auto; }
  .events li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .events .ts { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .empty { font-size: 13px; color: var(--muted); padding: 14px 0; text-align: center; }
  .hide { display: none; }
  @media (max-width: 900px) {
    .wrap { flex-direction: column; }
    .side { width: 100%; height: auto; position: static; }
    .grid, .shop-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1><span class="leaf">🌿</span>家庭营养膳食规划</h1>
    <div class="sub">配餐 · 分工采购 · 到货入库 · 消耗与续配联动</div>

    <div class="tabs">
      <div class="tab on" data-mode="day">单日配餐</div>
      <div class="tab" data-mode="week">周菜单</div>
      <div class="tab" data-mode="shop">采购库存</div>
    </div>

    <div class="field">
      <label>家庭成员</label>
      <select id="age_group"></select>
    </div>
    <div class="field">
      <label>活动水平</label>
      <select id="activity"></select>
    </div>
    <div class="field">
      <label>膳食目标</label>
      <select id="goal"></select>
    </div>
    <div class="field">
      <label>每日预算（元）</label>
      <div class="budget-row">
        <input type="range" id="budget" min="10" max="60" value="25" step="1">
        <span class="budget-val" id="budget_val">25 元</span>
      </div>
    </div>
    <div class="field">
      <label>需规避的过敏原</label>
      <div class="chips" id="allergens"></div>
    </div>
    <div class="field">
      <label>排除食材</label>
      <select id="exclude" multiple size="6"></select>
    </div>
    <button class="go" id="go">生 成 方 案</button>
    <div class="hint" id="side_hint">按膳食参考摄入量计算营养目标，求解热量区间、宏量营养素供能比、微量营养素达标与预算等多维约束，并保证一周内食材轮换与蛋白质来源多样化。</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="view_title">单日膳食方案</h2>
      <div class="meta" id="view_meta"></div>
    </div>
    <div id="banner"></div>

    <div id="day_view">
      <div class="grid" id="meals"></div>
      <div class="summary" id="day_summary"></div>
    </div>

    <div id="week_view" class="hide">
      <div class="diversity" id="diversity"></div>
      <div class="summary">
        <h3>家庭采购
          <button class="btn" id="attach_week">🛒 载入本周并生成采购清单</button>
        </h3>
        <div style="font-size:13px;color:var(--muted);line-height:1.7">
          将当前周菜单按食材聚合为采购清单（已扣除期初库存），随后可在「采购库存」页为家人分工、确认到货、按日消耗，并依据库存与剩余预算续配后续菜单。
        </div>
      </div>
      <div class="week-grid" id="week_grid"></div>
    </div>

    <div id="shop_view" class="hide">
      <div id="shop_banners"></div>
      <div class="shop-grid">
        <div class="summary" id="budget_panel"></div>
        <div class="summary" id="member_panel"></div>
      </div>
      <div class="summary" id="lines_panel"></div>
      <div class="summary" id="stock_panel"></div>
      <div class="summary" id="consume_panel"></div>
      <div class="summary" id="events_panel"></div>
    </div>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const meta = { profiles: {}, activities: {}, goals: {}, allergens: [], nutrient_labels: {}, nutrient_order: [] };
const state = { mode: "day", plan: null, week: null, shop: null, foods: [] };

function initMeta(m) {
  meta.profiles = m.profiles; meta.activities = m.activities; meta.goals = m.goals;
  meta.allergens = m.allergens; meta.nutrient_labels = m.nutrient_labels;
  meta.nutrient_order = m.nutrient_order;
  const sel = (id, map) => {
    const el = $(id);
    el.innerHTML = Object.entries(map).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    return el;
  };
  sel("#age_group", m.profiles);
  sel("#activity", m.activities);
  sel("#goal", m.goals);
  $("#allergens").innerHTML = m.allergens.map(a => `<span class="chip" data-a="${a}">${a}</span>`).join("");
  document.querySelectorAll("#allergens .chip").forEach(c => {
    c.onclick = () => c.classList.toggle("on");
  });
}

async function loadFoods() {
  const r = await fetch("/api/foods");
  const d = await r.json();
  state.foods = d.foods;
  $("#exclude").innerHTML = d.foods.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
}

function collectParams() {
  const allergens = [...document.querySelectorAll("#allergens .chip.on")].map(c => c.dataset.a);
  const exclude = [...$("#exclude").selectedOptions].map(o => o.value);
  return {
    profile: {
      age_group: $("#age_group").value,
      activity: $("#activity").value,
      goal: $("#goal").value,
    },
    budget: Number($("#budget").value),
    allergens,
    exclude,
  };
}

async function api(url, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(url, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || "请求失败"), { status: r.status, blocked: d.blocked });
  return d;
}

function roleLabel(role) {
  return { staple: "主食", protein: "主菜", dairy_egg: "蛋奶", veg_a: "蔬菜", veg_b: "蔬菜", oil: "油脂", fruit: "水果", nut: "坚果" }[role] || role;
}

function renderDay(r, req) {
  const meals = { breakfast: [], lunch: [], dinner: [] };
  r.items.forEach(it => {
    (meals[it.meal] = meals[it.meal] || []).push(it);
  });
  const mealNames = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
  $("#meals").innerHTML = ["breakfast", "lunch", "dinner"].map(m => `
    <div class="meal-card">
      <h3>${mealNames[m]}<span class="cost">¥${meals[m].reduce((s, i) => s + i.cost, 0).toFixed(1)}</span></h3>
      <ul>${meals[m].map(i => `
        <li><span><span class="role-tag">${roleLabel(i.role)}</span>${i.name}</span>
        <span class="g">${i.grams}g · ¥${i.cost.toFixed(1)}</span></li>`).join("")}
      </ul>
    </div>`).join("");

  const t = r.totals;
  const rr = r.ratios;
  const reqKcal = req.kcal;
  const kcalPct = Math.min(100, Math.round(t.kcal / reqKcal * 100));
  const pctCls = p => p >= 80 && p <= 120 ? "good" : (p >= 60 ? "warn" : "bad");
  const adq = r.adequacy;
  const order = meta.nutrient_order.filter(n => adq[n]);
  $("#day_summary").innerHTML = `
    <h3>营养汇总 · 总花费 ¥${t.cost.toFixed(1)}${t.purchase_cost != null && t.purchase_cost < t.cost ? `（库存抵扣后采购 ¥${t.purchase_cost.toFixed(1)}）` : ""}</h3>
    <div class="stat-row">
      <div class="stat"><div class="k">热量 / 目标</div>
        <div class="v">${Math.round(t.kcal)}<small> / ${reqKcal} kcal</small></div>
        <div class="bar"><i style="width:${kcalPct}%"></i></div></div>
      <div class="stat"><div class="k">蛋白质</div><div class="v">${t.protein.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">脂肪</div><div class="v">${t.fat.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">碳水</div><div class="v">${t.carb.toFixed(1)}<small>g</small></div></div>
      <div class="stat"><div class="k">膳食纤维</div><div class="v">${t.fiber.toFixed(1)}<small>g / ≥${req.fiber}g</small></div></div>
    </div>
    <div style="font-size:13px;font-weight:600;margin-top:8px">宏量营养素供能比</div>
    <div class="macro">
      <i style="width:${(rr.fat * 100).toFixed(1)}%;background:#d98e2b"></i>
      <i style="width:${(rr.protein * 100).toFixed(1)}%;background:#2e8b57"></i>
      <i style="width:${(rr.carb * 100).toFixed(1)}%;background:#5b8db8"></i>
    </div>
    <div class="macro-legend">
      <span><span class="legend-dot" style="background:#d98e2b"></span>脂肪 <b>${(rr.fat * 100).toFixed(1)}%</b>（目标 20-30%）</span>
      <span><span class="legend-dot" style="background:#2e8b57"></span>蛋白质 <b>${(rr.protein * 100).toFixed(1)}%</b>（目标 10-20%）</span>
      <span><span class="legend-dot" style="background:#5b8db8"></span>碳水 <b>${(rr.carb * 100).toFixed(1)}%</b>（目标 50-65%）</span>
    </div>
    <h3 style="margin-top:16px">微量营养素达标度</h3>
    <div class="adequacy">${order.map(n => {
      const a = adq[n];
      const label = meta.nutrient_labels[n] || n;
      if (n === "sodium") {
        const p = Math.round(a.pct);
        return `<div class="adq"><div class="top"><span>${label}</span><span class="pct ${p > 100 ? 'warn' : 'good'}">${p}%</span></div>
          <div class="bar"><i style="width:${Math.min(100, p)}%;${p > 100 ? 'background:#d98e2b' : ''}"></i></div>
          <div style="font-size:11px;color:#6b7d70">${a.value}mg / 上限${a.max}mg</div></div>`;
      }
      const p = Math.round(a.pct);
      return `<div class="adq"><div class="top"><span>${label}</span><span class="pct ${pctCls(p)}">${p}%</span></div>
        <div class="bar"><i style="width:${Math.min(100, p)}%"></i></div>
        <div style="font-size:11px;color:#6b7d70">${a.value} / 目标${a.target}</div></div>`;
    }).join("")}</div>`;
}

function renderDayMeta(r, req) {
  $("#view_title").textContent = "单日膳食方案";
  $("#view_meta").textContent = `${req.profile_label} · 活动水平 ${meta.activities[state.params.profile.activity]} · ${meta.goals[state.params.profile.goal]} · 预算 ¥${state.params.budget}/日`;
  const banner = $("#banner");
  if (r.feasible) {
    banner.className = "banner good";
    banner.textContent = "方案已生成，满足热量、宏量营养素供能比与预算约束。";
  } else {
    banner.className = "banner bad";
    banner.textContent = "当前参数下无法生成完全满足约束的方案：" + (r.reasons && r.reasons.length ? r.reasons.join("；") : "约束过紧");
  }
}

function renderWeek(w, req) {
  $("#view_title").textContent = "一周膳食菜单";
  $("#view_meta").textContent = `${req.profile_label} · 全周 ${w.days.length} 天 · 周总花费 ¥${w.weekly_cost.toFixed(1)}（按目录价采购估算 ¥${w.weekly_purchase_cost.toFixed(1)}）`;
  const d = w.diversity;
  $("#diversity").innerHTML = `
    <div class="div-item"><div class="d">${d.unique_foods}</div><div class="k">全周不重复食材</div></div>
    <div class="div-item"><div class="d">${d.protein_kinds}/${d.protein_kinds_max}</div><div class="k">蛋白质来源类别</div></div>
    <div class="div-item"><div class="d">${d.liver_count}</div><div class="k">肝脏类次数</div></div>
    <div class="div-item"><div class="d">${d.repeat_servings}</div><div class="k">跨天复用份次</div></div>
    <div class="div-item"><div class="d">¥${w.weekly_cost.toFixed(1)}</div><div class="k">一周总花费</div></div>`;
  const meals = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
  $("#week_grid").innerHTML = w.days.map(day => `
    <div class="day-card">
      <div class="head"><h3>${day.day_name}</h3><span class="cost">¥${day.cost.toFixed(1)}</span></div>
      <div class="kcal">${Math.round(day.totals.kcal)} kcal · 蛋白 ${day.totals.protein.toFixed(1)}g / 脂肪 ${day.totals.fat.toFixed(1)}g / 碳水 ${day.totals.carb.toFixed(1)}g</div>
      ${["breakfast", "lunch", "dinner"].map(m => {
        const its = day.items.filter(i => i.meal === m);
        if (!its.length) return "";
        return `<div class="meal-sep">${meals[m]}</div><ul>${its.map(i => `
          <li><span>${i.name}</span><span>${i.grams}g</span></li>`).join("")}</ul>`;
      }).join("")}
    </div>`).join("");
  const banner = $("#banner");
  if (w.feasible) {
    banner.className = "banner good";
    banner.textContent = "周菜单生成完毕：相邻两天不重复食材，午餐蛋白质类别逐日轮换，肝脏类每周至多 1 次。";
  } else {
    banner.className = "banner bad";
    banner.textContent = "部分天数约束未完全满足，请调整参数。";
  }
}

async function generate() {
  $("#go").disabled = true;
  const params = collectParams();
  state.params = params;
  try {
    if (state.mode === "day") {
      const d = await api("/api/plan", params);
      state.plan = d;
      renderDayMeta(d, d.requirement);
      renderDay(d, d.requirement);
    } else if (state.mode === "week") {
      const d = await api("/api/week", params);
      state.week = d;
      renderWeek(d, d.requirement);
    } else {
      await api("/api/household/settings", params);
      await loadShop();
    }
  } catch (e) {
    $("#banner").className = "banner bad";
    $("#banner").textContent = e.message;
  } finally {
    $("#go").disabled = false;
  }
}

/* ================= 采购与库存 ================= */
function shopBanner(kind, text) {
  $("#shop_banners").innerHTML = `<div class="banner ${kind}">${text}</div>`;
}
function clearShopBanner() { $("#shop_banners").innerHTML = ""; }

async function loadShop() {
  state.shop = await api("/api/household");
  renderShop();
}

function renderShop() {
  const s = state.shop;
  renderBudget(s);
  renderMembers(s);
  renderLines(s);
  renderStock(s);
  renderConsume(s);
  renderEvents(s);
}

function renderBudget(s) {
  const b = s.budget;
  const spentPct = Math.min(100, Math.round(b.spent / b.weekly * 100));
  const projPct = Math.min(100, Math.round(b.projected_total / b.weekly * 100));
  const avoided = (s.settings.allergens || []).join("、") || "无";
  $("#budget_panel").innerHTML = `
    <h3>预算同步 · 周预算 ¥${b.weekly.toFixed(2)}
      <span style="font-size:12px;font-weight:400;color:var(--muted)">规避过敏原：${avoided}</span></h3>
    <div class="stat-row">
      <div class="stat"><div class="k">已实际支出（到货）</div>
        <div class="v ${b.over_budget ? "over" : ""}">¥${b.spent.toFixed(2)}</div>
        <div class="bar"><i style="width:${spentPct}%;${b.over_budget ? "background:var(--bad)" : ""}"></i></div></div>
      <div class="stat"><div class="k">待采购估算</div><div class="v">¥${b.pending_estimated.toFixed(2)}</div></div>
      <div class="stat"><div class="k">剩余可用</div>
        <div class="v ${b.remaining < 0 ? "over" : ""}">¥${b.remaining.toFixed(2)}</div></div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">预计本周总支出 ¥${b.projected_total.toFixed(2)}（含待采购）</div>
    <div class="bar"><i style="width:${projPct}%;${b.projected_over ? "background:var(--accent)" : ""}"></i></div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">期初库存估值 ¥${b.opening_value.toFixed(2)} 不计入本周支出；现有库存估值 ¥${s.stock_value.toFixed(2)}。</div>`;
}

function renderMembers(s) {
  const cards = s.members.map(m => {
    const a = s.assignments.find(x => x.member_id === m.id) || { pending: 0, arrived: 0, pending_grams: 0 };
    return `<div class="member-card">
      <button class="rm" data-rm="${m.id}" title="移除">✕</button>
      <div class="nm">${m.name}</div>
      <div class="dd">待采购 ${a.pending} 项 · ${Math.round(a.pending_grams)}g<br>已到货 ${a.arrived} 项</div>
    </div>`;
  }).join("");
  $("#member_panel").innerHTML = `
    <h3>家人分工
      <button class="btn ghost sm" id="auto_assign">⚖ 自动均衡分工</button>
    </h3>
    <div class="inline-form" style="margin-bottom:12px">
      <input type="text" id="new_member" placeholder="成员姓名，如：爸爸" style="flex:1;min-width:140px">
      <button class="btn" id="add_member">添加家人</button>
    </div>
    <div class="members">${cards || '<div class="empty" style="width:100%">还没有成员，先添加家人再分工采购</div>'}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:10px">待采购 ${s.pending_count} 项 / 已到货 ${s.arrived_count} 项 / 未分工 ${s.unassigned_count} 项</div>`;

  $("#add_member").onclick = async () => {
    const name = $("#new_member").value.trim();
    if (!name) return;
    await api("/api/household/members", { name });
    await loadShop();
  };
  $("#new_member").onkeydown = e => { if (e.key === "Enter") $("#add_member").click(); };
  $("#auto_assign").onclick = async () => {
    try { await api("/api/household/auto-assign", {}); } catch (e) { alert(e.message); }
    await loadShop();
  };
  document.querySelectorAll("[data-rm]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("移除该成员？其名下采购项将回到待认领。")) return;
      await api(`/api/household/members/${encodeURIComponent(btn.dataset.rm)}`, { action: "remove" });
      await loadShop();
    };
  });
}

function allergenFlags(s, foodId, allergensArr) {
  const avoided = new Set(s.settings.allergens || []);
  return (allergensArr || []).filter(a => avoided.has(a))
    .map(a => `<span class="allergen-flag">⚠ ${a}</span>`).join("");
}

function renderLines(s) {
  if (!s.week_attached) {
    $("#lines_panel").innerHTML = `<h3>采购清单</h3><div class="empty">请先在「周菜单」页生成一周菜单，并点击「载入本周并生成采购清单」。</div>`;
    return;
  }
  const groups = new Map();
  for (const l of s.lines) {
    const key = l.status === "arrived" ? "__arrived" : (l.assignee || "__none");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l);
  }
  const order = [...s.members.map(m => m.id), "__none", "__arrived"];
  const memberName = id => (s.members.find(m => m.id === id) || {}).name;
  const opts = l => `<option value="">待认领</option>` +
    s.members.map(m => `<option value="${m.id}" ${l.assignee === m.id ? "selected" : ""}>${m.name}</option>`).join("");

  const tableOf = list => `<table class="shop">
    <tr><th>食材</th><th>需求</th><th>已到</th><th>状态</th><th>负责人</th><th>操作</th></tr>
    ${list.map(l => {
      const f = state.foods.find(x => x.id === l.food_id) || { allergens: [] };
      return `<tr>
        <td><b>${l.name}</b>${allergenFlags(s, l.food_id, f.allergens)}</td>
        <td>${l.need_grams}g</td>
        <td>${l.arrived_grams}g</td>
        <td><span class="st ${l.status === "arrived" ? "st-arrived" : "st-pending"}">${l.status === "arrived" ? "已到货" : "待采购"}</span></td>
        <td><select data-assign="${l.id}" ${l.status === "arrived" ? "disabled" : ""}>${opts(l)}</select></td>
        <td>${l.status === "arrived"
          ? `<span style="font-size:12px;color:var(--brand-dark)">¥${(l.cost_actual || 0).toFixed(2)}</span>`
          : `<button class="btn sm" data-arrive="${l.id}">确认到货</button> <button class="btn sm ghost" data-arrive-part="${l.id}">部分/改价</button>`}</td>
      </tr>`;
    }).join("")}
  </table>`;

  let html = `<h3>采购清单（按家人分工）</h3>`;
  if (!s.lines.length) html += `<div class="empty">本周食材均已到货并消耗，无需采购。</div>`;
  for (const key of order) {
    const list = groups.get(key);
    if (!list || !list.length) continue;
    if (key === "__arrived") html += `<div class="group-title">✅ 已到货（${list.length}）</div>`;
    else if (key === "__none") html += `<div class="group-title">🙋 待认领（${list.length}）</div>`;
    else html += `<div class="group-title">🛍 ${memberName(key)} 的采购（${list.length}）</div>`;
    html += tableOf(list);
  }
  $("#lines_panel").innerHTML = html;

  document.querySelectorAll("select[data-assign]").forEach(sel => {
    sel.onchange = async () => {
      await api("/api/household/lines/assign", { line_id: sel.dataset.assign, member_id: sel.value || null });
      await loadShop();
    };
  });
  document.querySelectorAll("button[data-arrive]").forEach(btn => {
    btn.onclick = () => doArrive(btn.dataset.arrive, false);
  });
  document.querySelectorAll("button[data-arrive-part]").forEach(btn => {
    btn.onclick = () => doArrive(btn.dataset.arrivePart, true);
  });
}

async function doArrive(lineId, partial) {
  const line = state.shop.lines.find(l => l.id === lineId);
  let arrived_grams = null;
  let cost = null;
  if (partial) {
    const g = prompt(`「${line.name}」本次到货克重（需求 ${line.need_grams}g，已到 ${line.arrived_grams}g）：`, Math.max(0, line.need_grams - line.arrived_grams));
    if (g == null) return;
    arrived_grams = Number(g);
    if (!(arrived_grams > 0)) { alert("数量需大于 0"); return; }
    const c = prompt("实际花费（元，留空按目录价计算）：", "");
    if (c == null) return;
    if (c.trim() !== "") { cost = Number(c); if (!(cost >= 0)) { alert("花费非法"); return; } }
  }
  const post = force => api("/api/household/arrive", { line_id: lineId, arrived_grams, cost, force });
  try {
    await post(false);
    shopBanner("good", `「${line.name}」已确认到货，库存与预算已同步。`);
  } catch (e) {
    if (e.status === 409 && e.blocked) {
      if (!confirm(`${e.message}\n\n确认仍要入库吗？（入库后将在库存中标注过敏原，后续配餐会继续规避）`)) return;
      await post(true);
      shopBanner("warn", `「${line.name}」含过敏原已强制入库，库存已标注，请配餐时留意。`);
    } else { alert(e.message); return; }
  }
  await loadShop();
}

function renderStock(s) {
  const rows = s.stock.length
    ? s.stock.map(x => `<tr>
        <td><b>${x.name}</b>${x.allergen_hit.length ? `<span class="allergen-flag">⚠ ${x.allergen_hit.join("、")}</span>` : ""}</td>
        <td>${x.cat_label}</td>
        <td>${x.grams}g</td>
        <td>¥${x.value.toFixed(2)}</td>
      </tr>`).join("")
    : `<tr><td colspan="4" class="empty">暂无库存，可在下方录入期初库存或等待采购到货。</td></tr>`;
  const foodOpts = state.foods.map(f => `<option value="${f.id}">${f.name}</option>`).join("");
  $("#stock_panel").innerHTML = `
    <h3>家中库存（估值 ¥${s.stock_value.toFixed(2)}）</h3>
    <table class="shop">
      <tr><th>食材</th><th>分类</th><th>库存</th><th>估值</th></tr>
      ${rows}
    </table>
    <div class="inline-form" style="margin-top:14px">
      <select id="si_food" style="min-width:150px">${foodOpts}</select>
      <input type="number" id="si_grams" placeholder="克重 g" min="1" style="width:110px">
      <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="si_opening"> 期初库存（不计本周支出）</label>
      <button class="btn" id="si_btn">入库</button>
    </div>`;

  $("#si_btn").onclick = async () => {
    const foodId = $("#si_food").value;
    const grams = Number($("#si_grams").value);
    const kind = $("#si_opening").checked ? "opening" : "purchase";
    if (!(grams > 0)) { alert("请输入大于 0 的克重"); return; }
    const post = force => api("/api/household/stock-in", { food_id: foodId, grams, kind, force });
    try {
      await post(false);
    } catch (e) {
      if (e.status === 409 && e.blocked) {
        if (!confirm(`${e.message}\n\n仍要入库吗？`)) return;
        await post(true);
      } else { alert(e.message); return; }
    }
    $("#si_grams").value = "";
    await loadShop();
  };
}

function renderConsume(s) {
  if (!s.week_attached) {
    $("#consume_panel").innerHTML = `<h3>本周到货与消耗</h3><div class="empty">载入周菜单后可按日确认三餐消耗。</div>`;
    return;
  }
  const next = s.consumed.indexOf(false);
  const chips = s.day_names.map((name, d) => {
    const done = s.consumed[d];
    const cls = done ? "done" : (d === next ? "next" : (d < next ? "done" : "locked"));
    const mark = done ? "✓ " : (d === next ? "▶ " : "");
    return `<div class="day-chip ${cls}" data-day="${d}">${mark}${name}</div>`;
  }).join("");
  const warningHtml = s.warnings.length
    ? `<ul style="font-size:12.5px;color:#9a6212;margin:6px 0 0 18px;line-height:1.7">${s.warnings.map(w => `<li>${w}</li>`).join("")}</ul>`
    : `<div style="font-size:12.5px;color:var(--brand-dark);margin-top:6px">预算、分工与过敏规避状态正常。</div>`;
  $("#consume_panel").innerHTML = `
    <h3>本周到货与消耗（${s.consumed_count}/7 天）
      <button class="btn" id="plan_remaining" ${next === -1 ? "disabled" : ""}>🔁 按库存与剩余预算续配后续菜单</button>
    </h3>
    <div class="day-strip">${chips}</div>
    <div style="font-size:12px;color:var(--muted)">依次确认每日三餐消耗：系统扣减库存、记录缺货项、把已消耗计入周限次并重算采购清单；点击 ✓ 可撤销当日消耗。</div>
    <div style="margin-top:10px"><b style="font-size:13px">联动提示</b>${warningHtml}</div>
    ${s.shortages.length ? `<div style="margin-top:10px;font-size:12.5px;color:var(--bad)">未来菜单仍有 ${s.shortages.length} 项库存缺口：${s.shortages.map(x => `${x.name} ${x.short_grams}g`).join("、")}</div>` : ""}`;

  document.querySelectorAll(".day-chip").forEach(ch => {
    ch.onclick = async () => {
      const d = Number(ch.dataset.day);
      if (s.consumed[d]) {
        if (d !== s.consumed.lastIndexOf(true)) { alert("请从最近一天开始依次撤销消耗。"); return; }
        await api("/api/household/consume/undo", { day: d });
        shopBanner("good", `${s.day_names[d]} 消耗已撤销，库存与采购清单已回退。`);
      } else {
        if (d !== next) return;
        const r = await api("/api/household/consume", { day: d });
        if (r.shortfall.length) {
          shopBanner("warn", `${s.day_names[d]} 已消耗并扣减库存；${r.shortfall.length} 项库存不足已临时补缺：` +
            r.shortfall.map(x => `${x.name} 缺 ${x.short_grams}g`).join("、") + "。采购清单已重算。");
        } else if (r.allergenHits.length) {
          shopBanner("warn", `${s.day_names[d]} 已消耗，当日含规避过敏原食材：${r.allergenHits.map(x => x.name).join("、")}。`);
        } else {
          shopBanner("good", `${s.day_names[d]} 三餐已消耗，库存、预算与采购清单已同步。`);
        }
      }
      await loadShop();
    };
  });
  $("#plan_remaining").onclick = async () => {
    const r = await api("/api/household/plan-remaining", {});
    state.week = { ...state.week, days: r.days };
    if (r.feasible) {
      shopBanner("good", `已从${r.start_day_name}起续配 ${r.planned_days.length} 天：优先消耗家中库存，预计新增采购 ¥${r.planned_purchase_cost.toFixed(2)}，剩余预算 ¥${r.remaining_budget.toFixed(2)}。`);
    } else {
      shopBanner("bad", `已续配${r.start_day_name}起的菜单，但部分日期在剩余预算下无法完全达标，请考虑放宽预算或提前补采。`);
    }
    await loadShop();
  };
}

function renderEvents(s) {
  $("#events_panel").innerHTML = `
    <h3>家庭动态</h3>
    <ul class="events">${s.events.length ? s.events.map(e =>
      `<li><span class="ts">${e.ts.replace("T", " ").slice(5, 16)}</span><span>${e.text}</span></li>`).join("")
      : '<li class="empty">暂无动态</li>'}</ul>`;
}

/* ---------- 周菜单载入 ---------- */
$("#attach_week").onclick = async () => {
  if (!state.week) { alert("请先生成周菜单"); return; }
  try {
    await api("/api/household/settings", collectParams());
    await api("/api/household/week/attach", { week: state.week, params: state.params });
    switchMode("shop");
    await loadShop();
    shopBanner("good", "本周菜单已载入：采购清单已按食材聚合（未来需求 − 现有库存），并为待采购项自动预分工。");
  } catch (e) {
    alert(e.message);
  }
};

function switchMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.mode === mode));
  $("#day_view").classList.toggle("hide", mode !== "day");
  $("#week_view").classList.toggle("hide", mode !== "week");
  $("#shop_view").classList.toggle("hide", mode !== "shop");
  $("#go").textContent = mode === "shop" ? "同 步 设 置" : "生 成 方 案";
  $("#side_hint").textContent = mode === "shop"
    ? "此处的画像、每日预算、过敏原与排除项会同步为家庭采购与续配的约束；修改后点击「同步设置」。"
    : "按膳食参考摄入量计算营养目标，求解热量区间、宏量营养素供能比、微量营养素达标与预算等多维约束，并保证一周内食材轮换与蛋白质来源多样化。";
  clearShopBanner();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = async () => {
    switchMode(t.dataset.mode);
    if (state.mode === "day") {
      if (state.plan) { renderDayMeta(state.plan, state.plan.requirement); renderDay(state.plan, state.plan.requirement); }
      else generate();
    } else if (state.mode === "week") {
      if (state.week) renderWeek(state.week, state.week.requirement);
      else generate();
    } else {
      await api("/api/household/settings", collectParams()).catch(() => {});
      await loadShop();
    }
  };
});

$("#budget").oninput = () => { $("#budget_val").textContent = $("#budget").value + " 元"; };
